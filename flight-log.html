<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight App — Flight Logbook</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f5f8fc;--card:#fff;--line:#e1e8f0;--text:#152033;--muted:#6a788b;--blue:#2563eb;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif}.nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}.brand{font:800 20px Manrope;color:#111827;text-decoration:none}.links{margin-left:auto;display:flex;gap:8px}.links a{padding:10px 12px;text-decoration:none;color:#526174;border-radius:10px;font-weight:700;font-size:14px}.links .active,.links a:hover{background:#edf4ff;color:var(--blue)}main{max-width:1180px;margin:auto;padding:42px 22px 70px}.hero h1{font:800 40px Manrope;margin:5px 0}.hero p{color:var(--muted)}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px;margin-top:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 28px rgba(20,45,80,.06)}label{display:block;font-weight:700;font-size:13px;margin:14px 0 7px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:white;width:100%;margin-top:17px}.danger{background:#fff0f0;color:#b91c1c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{background:#f7f9fc;border:1px solid var(--line);border-radius:13px;padding:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{font:800 24px Manrope;display:block;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:35px}.flight{display:grid;grid-template-columns:1fr auto;gap:10px;border-top:1px solid var(--line);padding:16px 0}.flight:first-child{border-top:0}.route{font:800 18px Manrope}.meta{color:var(--muted);font-size:13px;margin-top:4px}.hours{font-weight:800;color:var(--green)}@media(max-width:850px){.layout{grid-template-columns:1fr}.links a{display:none}.links a:nth-child(1),.links a:nth-child(2){display:block}.nav{padding:0 15px}.stats{grid-template-columns:1fr}}
</style></head><body><nav class="nav"><a class="brand" href="index.html">✈ Flight App</a><div class="links"><a href="weather.html">Weather</a><a href="charts.html">Charts</a><a href="planner.html">Planner</a><a href="games.html">Games</a><a href="aircraft.html">Aircraft</a><a class="active" href="flight-log.html">Logbook</a></div></nav><main><section class="hero"><h1>My Flight Logbook</h1><p>Keep a simple local record of your simulator flights. Your entries stay in this browser using local storage.</p></section><div class="layout"><section class="card"><h2>Add flight</h2><label>Date</label><input id="date" type="date"><label>Aircraft</label><input id="aircraft" placeholder="A320neo"><label>From</label><input id="from" placeholder="EHAM"><label>To</label><input id="to" placeholder="LGSM"><label>Flight time (minutes)</label><input id="minutes" type="number" min="0" placeholder="185"><label>Notes</label><input id="notes" placeholder="VATSIM, ILS approach, etc."><button class="primary" onclick="addFlight()">Add to logbook</button></section><section class="card"><div class="stats"><div class="stat"><span>Flights</span><strong id="count">0</strong></div><div class="stat"><span>Total time</span><strong id="total">0h</strong></div><div class="stat"><span>Aircraft types</span><strong id="types">0</strong></div></div><div id="list"></div></section></div></main><script>
let flights=JSON.parse(localStorage.getItem('flightAppLogbook')||'[]');document.getElementById('date').value=new Date().toISOString().slice(0,10);
function addFlight(){const f={date:date.value,aircraft:aircraft.value.trim()||'Unknown',from:from.value.trim().toUpperCase()||'----',to:to.value.trim().toUpperCase()||'----',minutes:Number(minutes.value)||0,notes:notes.value.trim()};if(!f.date||f.minutes<0)return;flights.unshift(f);save();['aircraft','from','to','minutes','notes'].forEach(id=>document.getElementById(id).value='')}
function removeFlight(i){flights.splice(i,1);save()}function save(){localStorage.setItem('flightAppLogbook',JSON.stringify(flights));render()}function render(){count.textContent=flights.length;let mins=flights.reduce((s,f)=>s+f.minutes,0);total.textContent=Math.floor(mins/60)+'h '+(mins%60)+'m';types.textContent=new Set(flights.map(f=>f.aircraft.toLowerCase())).size;list.innerHTML=flights.length?flights.map((f,i)=>`<div class="flight"><div><div class="route">${f.from} → ${f.to}</div><div class="meta">${f.date} · ${f.aircraft} · ${f.notes||'No notes'}</div></div><div><div class="hours">${Math.floor(f.minutes/60)}h ${f.minutes%60}m</div><button class="danger" onclick="removeFlight(${i})">Delete</button></div></div>`).join(''):'<div class="empty">No flights logged yet. Add your first simulator flight.</div>'}render();
</script></body></html>

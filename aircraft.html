<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flight App — Aircraft Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"><style>
:root{--bg:#f5f8fc;--card:#fff;--line:#e2e9f2;--text:#152033;--muted:#6b788b;--blue:#2563eb;--soft:#edf4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"DM Sans",sans-serif;color:var(--text)}.nav{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 28px}.brand{font:800 20px Manrope;text-decoration:none;color:#111827}.links{margin-left:auto;display:flex;gap:7px}.links a{padding:10px 12px;border-radius:10px;color:#526174;text-decoration:none;font-weight:700;font-size:14px}.links a:hover,.links .active{background:var(--soft);color:var(--blue)}main{max-width:1180px;margin:auto;padding:42px 22px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:800}.hero h1{font:800 40px Manrope;margin:8px 0}.hero p{color:var(--muted);max-width:750px;line-height:1.6}.toolbar{display:flex;gap:12px;margin:28px 0;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}.filter{padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:21px;box-shadow:0 10px 28px rgba(20,45,80,.06)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--soft);color:var(--blue);font-size:11px;font-weight:800}.card h2{font:800 21px Manrope;margin:13px 0 5px}.maker{color:var(--muted);font-weight:600}.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.spec{background:#f8fafc;border-radius:10px;padding:10px}.spec span{display:block;color:var(--muted);font-size:11px}.spec strong{display:block;margin-top:2px}.empty{text-align:center;color:var(--muted);padding:50px;grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr}.links a{display:none}.links a:nth-child(1),.links a:nth-child(2){display:block}.nav{padding:0 15px}}
</style><link rel="stylesheet" href="site-shell.css">
</head><body><nav class="nav"><a class="brand" href="index.html">✈ Flight App</a><div class="links"><a href="weather.html">Weather</a><a href="charts.html">Charts</a><a href="planner.html">Planner</a><a href="games.html">Games</a><a class="active" href="aircraft.html">Aircraft</a><a href="flight-log.html">Logbook</a></div></nav><main><section class="hero"><div class="eyebrow">Aircraft Library</div><h1>Know your aircraft</h1><p>A quick reference library for common aircraft you can encounter in flight simulation. Search by aircraft, manufacturer, engine or role.</p></section><div class="toolbar"><input id="search" class="search" placeholder="Search aircraft, manufacturer or role…"><select id="filter" class="filter"><option value="all">All manufacturers</option><option>Airbus</option><option>Boeing</option><option>Embraer</option><option>ATR</option></select></div><section id="grid" class="grid"></section></main><script>
const aircraft=[
{name:"A319",maker:"Airbus",role:"Narrowbody",engines:"CFM56 / IAE V2500",range:"≈ 3,700 nm",seats:"≈ 120–156",span:"35.8 m"},
{name:"A320",maker:"Airbus",role:"Narrowbody",engines:"CFM56 / V2500",range:"≈ 3,300 nm",seats:"≈ 140–186",span:"35.8 m"},
{name:"A321neo",maker:"Airbus",role:"Narrowbody",engines:"LEAP-1A / PW1100G",range:"≈ 4,000 nm",seats:"≈ 180–244",span:"35.8 m"},
{name:"A330-300",maker:"Airbus",role:"Widebody",engines:"Trent 700 / CF6 / PW4000",range:"≈ 6,350 nm",seats:"≈ 250–300",span:"64.0 m"},
{name:"A350-900",maker:"Airbus",role:"Widebody",engines:"Trent XWB",range:"≈ 8,100 nm",seats:"≈ 300–350",span:"64.8 m"},
{name:"A380-800",maker:"Airbus",role:"Very large widebody",engines:"Trent 900 / GP7200",range:"≈ 8,000 nm",seats:"≈ 500–850+",span:"79.8 m"},
{name:"737-800",maker:"Boeing",role:"Narrowbody",engines:"CFM56-7B",range:"≈ 2,935 nm",seats:"≈ 162–189",span:"35.8 m"},
{name:"737 MAX 8",maker:"Boeing",role:"Narrowbody",engines:"LEAP-1B",range:"≈ 3,550 nm",seats:"≈ 162–178",span:"35.9 m"},
{name:"787-9",maker:"Boeing",role:"Widebody",engines:"GEnx / Trent 1000",range:"≈ 7,635 nm",seats:"≈ 250–296",span:"60.1 m"},
{name:"747-8",maker:"Boeing",role:"Very large widebody",engines:"GEnx-2B",range:"≈ 7,730 nm",seats:"≈ 410–467",span:"68.4 m"},
{name:"E190",maker:"Embraer",role:"Regional jet",engines:"GE CF34",range:"≈ 2,450 nm",seats:"≈ 96–114",span:"28.7 m"},
{name:"E195-E2",maker:"Embraer",role:"Regional jet",engines:"PW1900G",range:"≈ 2,600 nm",seats:"≈ 120–146",span:"35.1 m"},
{name:"ATR 72-600",maker:"ATR",role:"Turboprop",engines:"PW127XT",range:"≈ 825 nm",seats:"≈ 44–78",span:"27.1 m"}];
function render(){let q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;let a=aircraft.filter(x=>(f==='all'||x.maker===f)&&Object.values(x).join(' ').toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.length?a.map(x=>`<article class="card"><span class="badge">${x.role}</span><h2>${x.name}</h2><div class="maker">${x.maker}</div><div class="specs"><div class="spec"><span>Engines</span><strong>${x.engines}</strong></div><div class="spec"><span>Typical range</span><strong>${x.range}</strong></div><div class="spec"><span>Seats</span><strong>${x.seats}</strong></div><div class="spec"><span>Wingspan</span><strong>${x.span}</strong></div></div></article>`).join(''):'<div class="empty">No aircraft match your search.</div>'}document.getElementById('search').oninput=render;document.getElementById('filter').onchange=render;render();
</script><script src="auth-client.js"></script>
<script src="site-shell.js"></script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checklists | Flight App</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}button,input,select{font:inherit}header{height:72px;background:#fff;border-bottom:1px solid #e1e7ef;display:flex;align-items:center;padding:0 30px;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:750;color:#1769d1;text-decoration:none}.nav{margin-left:35px;display:flex;gap:8px}.nav a{text-decoration:none;color:#5e6878;padding:9px 13px;border-radius:8px;font-size:14px;font-weight:600}.nav a:hover,.nav a.active{background:#e9f2ff;color:#1769d1}.status{margin-left:auto;display:flex;align-items:center;gap:8px;color:#687386;font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}.dot.online{background:#16a34a}.dot.offline{background:#dc2626}main{max-width:1450px;margin:auto;padding:32px}.heading{margin-bottom:25px}.heading h1{margin:0 0 7px;font-size:32px}.heading p{margin:0;color:#6c7686;font-size:15px}.controls{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(240px,1fr) 260px 220px;gap:12px;margin-bottom:24px}input,select{width:100%;height:44px;border:1px solid #d8e0ea;border-radius:9px;background:#fff;color:#172033;padding:0 13px;outline:none}.content{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;min-height:650px}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:14px;overflow:hidden}.panel-head{padding:17px 18px;border-bottom:1px solid #e7ebf1;display:flex;align-items:center;justify-content:space-between}.panel-head h2{margin:0;font-size:16px}.count{background:#edf3fa;color:#607086;border-radius:20px;padding:4px 9px;font-size:12px;font-weight:700}.aircraft-list{padding:8px;max-height:670px;overflow-y:auto}.aircraft-item{width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:9px;cursor:pointer;margin-bottom:3px}.aircraft-item:hover{background:#f3f7fc}.aircraft-item.selected{background:#eaf3ff}.aircraft-manufacturer{color:#7b8797;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}.aircraft-name{font-size:14px;font-weight:700;color:#253149}.aircraft-icao{font-size:11px;color:#8993a3;margin-top:3px}.empty{min-height:500px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px;color:#7c8797}.empty-inner{max-width:450px}.empty h3{margin:0 0 8px;color:#29354a;font-size:19px}.empty p{margin:0;line-height:1.6;font-size:14px}.selected-aircraft{padding:21px;border-bottom:1px solid #e7ebf1}.selected-aircraft small{display:block;color:#7b8797;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.7px;margin-bottom:5px}.selected-aircraft h2{margin:0;font-size:24px}.selected-aircraft p{margin:5px 0 0;color:#778294;font-size:13px}.category-grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;border-bottom:1px solid #e7ebf1}.category-button{border:1px solid #dce4ee;background:#fff;border-radius:10px;padding:13px;text-align:left;cursor:pointer}.category-button:hover{border-color:#8eb8e9;background:#f7fbff}.category-button.selected{border-color:#1769d1;background:#edf5ff}.category-name{font-size:13px;font-weight:750;color:#2a3549}.category-count{margin-top:4px;color:#7d8999;font-size:11px}.checklist-list{padding:18px}.category-heading{margin:18px 0 10px;padding:0 2px;font-size:12px;font-weight:800;color:#1769d1;text-transform:uppercase;letter-spacing:.7px}.checklist-card{border:1px solid #dfe6ef;border-radius:12px;padding:15px;margin-bottom:10px;display:flex;align-items:center;gap:15px;background:#fff;cursor:pointer}.checklist-card:hover{border-color:#91b8e5;background:#fafcff}.icon{width:48px;height:48px;border-radius:10px;background:#edf4fc;color:#1769d1;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}.card-info{min-width:0;flex:1}.card-title{font-size:14px;font-weight:750;margin-bottom:4px}.card-meta{color:#7b8797;font-size:12px}.open{border:0;background:#1769d1;color:#fff;padding:9px 13px;border-radius:8px;font-size:12px;font-weight:700}.viewer{display:none;position:fixed;inset:0;background:rgba(10,18,30,.88);z-index:100;padding:35px}.viewer.open{display:flex;flex-direction:column}.viewer-head{display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:15px}.viewer-head button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;width:40px;height:38px}.viewer-body{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:auto}.viewer-body img{max-width:95%;max-height:95%;object-fit:contain}@media(max-width:950px){header{padding:0 17px}.nav{display:none}main{padding:20px}.controls{grid-template-columns:1fr}.content{grid-template-columns:1fr}.aircraft-list{max-height:300px}}@media(max-width:600px){main{padding:13px}.category-grid{grid-template-columns:1fr}.checklist-card{align-items:flex-start}.open{display:none}.viewer{padding:15px}}
</style></head><body>
<header><a href="index.html" class="brand">Flight App</a><nav class="nav"><a href="index.html">Home</a><a href="planner.html">Planner</a><a href="weather.html">Weather</a><a href="charts.html">Charts</a><a href="checklists.html" class="active">Checklists</a><a href="simbrief.html">SimBrief</a></nav><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div></header>
<main><div class="heading"><h1>Aircraft Checklists</h1><p>Browse and view checklists for your aircraft.</p></div><section class="controls"><input id="searchInput" type="search" placeholder="Search checklists..."><select id="aircraftFilter"><option value="">All aircraft</option></select><select id="categoryFilter"><option value="">All categories</option></select></section><div class="content"><section class="panel"><div class="panel-head"><h2>Aircraft</h2><span class="count" id="aircraftCount">0</span></div><div class="aircraft-list" id="aircraftList"></div></section><section class="panel"><div id="checklistContent"><div class="empty"><div class="empty-inner"><h3>Select an aircraft</h3><p>Choose an aircraft to see its available checklists.</p></div></div></div></section></div></main>
<div class="viewer" id="viewer"><div class="viewer-head"><strong id="viewerTitle">Checklist</strong><button id="closeViewer">×</button></div><div class="viewer-body"><img id="viewerImage" alt="Checklist"></div></div>
<script>
const API_BASE="https://echo-msfs-charts.onrender.com";
const CATEGORIES=["PREFLIGHT","COCKPIT","BEFORE_START","START","TAXI","TAKEOFF","CLIMB","CRUISE","DESCENT","APPROACH","LANDING","SHUTDOWN","EMERGENCY","OTHER"].map((id,i)=>({id,name:{PREFLIGHT:"Preflight",COCKPIT:"Cockpit Preparation",BEFORE_START:"Before Start",START:"Engine Start",TAXI:"Taxi",TAKEOFF:"Takeoff",CLIMB:"Climb",CRUISE:"Cruise",DESCENT:"Descent",APPROACH:"Approach",LANDING:"Landing",SHUTDOWN:"Shutdown",EMERGENCY:"Emergency",OTHER:"Other"}[id],order:i}));
const state={aircraft:[],checklists:[],selectedAircraft:null,selectedCategory:""};const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
async function api(url){const r=await fetch(url,{headers:{Accept:"application/json"}});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||`HTTP ${r.status}`);return d}
function cat(v){return String(v||"").trim().toUpperCase()||"OTHER"}function catDef(v){return CATEGORIES.find(x=>x.id===cat(v))||CATEGORIES[CATEGORIES.length-1]}function catName(v){return catDef(v).name}function catOrder(v){return catDef(v).order}
async function init(){try{const h=await api(`${API_BASE}/api/health`);if(h.status!=="ok")throw Error("API unavailable");$("statusDot").className="dot online";$("statusText").textContent="API Online"}catch(e){$("statusDot").className="dot offline";$("statusText").textContent="API Offline"}try{const d=await api(`${API_BASE}/api/aircraft`);state.aircraft=Array.isArray(d.aircraft)?d.aircraft:[];populateAircraft();renderAircraft()}catch(e){console.error(e)}}
function populateAircraft(){const selects=[$("aircraftFilter")];selects.forEach(s=>{s.innerHTML='<option value="">All aircraft</option>';state.aircraft.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""))).forEach(a=>{const o=document.createElement("option");o.value=a.id;o.textContent=[a.manufacturer,a.name].filter(Boolean).join(" ");s.appendChild(o)})})$("aircraftCount").textContent=state.aircraft.length}
function renderAircraft(){const list=$("aircraftList");list.innerHTML="";if(!state.aircraft.length){list.innerHTML='<div class="empty" style="min-height:200px">No aircraft available.</div>';return}state.aircraft.slice().sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""))).forEach(a=>{const b=document.createElement("button");b.className="aircraft-item"+(Number(state.selectedAircraft)===Number(a.id)?" selected":"");b.innerHTML=`<div class="aircraft-manufacturer">${esc(a.manufacturer||"Unknown")}</div><div class="aircraft-name">${esc(a.name||"Unknown")}</div>${a.icao_type?`<div class="aircraft-icao">${esc(a.icao_type)}</div>`:""}`;b.onclick=()=>selectAircraft(a.id);list.appendChild(b)})}
async function selectAircraft(id){state.selectedAircraft=Number(id);state.selectedCategory="";renderAircraft();try{const d=await api(`${API_BASE}/api/checklists?aircraft_id=${encodeURIComponent(id)}`);state.checklists=Array.isArray(d.checklists)?d.checklists:[];renderContent()}catch(e){state.checklists=[];renderContent();console.error(e)}}
function renderContent(){const a=state.aircraft.find(x=>Number(x.id)===Number(state.selectedAircraft));const root=$("checklistContent");if(!a){root.innerHTML='<div class="empty"><div class="empty-inner"><h3>Select an aircraft</h3><p>Choose an aircraft to see its available checklists.</p></div></div>';return}let rows=state.checklists.slice();const q=$("searchInput").value.trim().toLowerCase();const cf=$("categoryFilter").value;if(q)rows=rows.filter(c=>[c.name,c.category].filter(Boolean).join(" ").toLowerCase().includes(q));if(cf)rows=rows.filter(c=>cat(c.category)===cf);rows.sort((x,y)=>catOrder(x.category)-catOrder(y.category)||String(x.name||"").localeCompare(String(y.name||"")));const used=[...new Set(rows.map(c=>cat(c.category)))].sort((x,y)=>catOrder(x)-catOrder(y));root.innerHTML=`<div class="selected-aircraft"><small>Selected aircraft</small><h2>${esc([a.manufacturer,a.name].filter(Boolean).join(" "))}</h2><p>${rows.length} checklist${rows.length===1?"":"s"}</p></div><div class="category-grid" id="categoryGrid"></div><div class="checklist-list" id="checklistList"></div>`;const cg=$("categoryGrid");const all=document.createElement("button");all.className="category-button"+(!state.selectedCategory?" selected":"");all.innerHTML=`<div class="category-name">All checklists</div><div class="category-count">${state.checklists.length} available</div>`;all.onclick=()=>{state.selectedCategory="";renderContent()};cg.appendChild(all);used.forEach(id=>{const b=document.createElement("button");b.className="category-button"+(state.selectedCategory===id?" selected":"");const n=state.checklists.filter(c=>cat(c.category)===id).length;b.innerHTML=`<div class="category-name">${esc(catName(id))}</div><div class="category-count">${n} checklist${n===1?"":"s"}</div>`;b.onclick=()=>{state.selectedCategory=state.selectedCategory===id?"":id;renderContent()};cg.appendChild(b)});if(state.selectedCategory)rows=rows.filter(c=>cat(c.category)===state.selectedCategory);const list=$("checklistList");if(!rows.length){list.innerHTML='<div class="empty" style="min-height:250px">No checklists found.</div>';return}let current="";rows.forEach(c=>{const id=cat(c.category);if(id!==current){current=id;const h=document.createElement("div");h.className="category-heading";h.textContent=catName(id);list.appendChild(h)}const card=document.createElement("div");card.className="checklist-card";card.innerHTML=`<div class="icon">✓</div><div class="card-info"><div class="card-title">${esc(c.name||"Checklist")}</div><div class="card-meta">${esc(catName(id))}</div></div><button class="open" type="button">Open</button>`;card.onclick=()=>openViewer(c);list.appendChild(card)})}
function openViewer(c){$("viewerTitle").textContent=c.name||"Checklist";$("viewerImage").src=`${API_BASE}/api/checklists/${encodeURIComponent(c.id)}/image`;$("viewer").classList.add("open")};$("closeViewer").onclick=()=>$("viewer").classList.remove("open");$("viewer").onclick=e=>{if(e.target.id==="viewer")$("viewer").classList.remove("open")};["searchInput","categoryFilter","aircraftFilter"].forEach(id=>$(id).addEventListener("input",()=>{if(id==="aircraftFilter"&&$(id).value){selectAircraft($(id).value)}else renderContent()}));init();
</script></body></html>

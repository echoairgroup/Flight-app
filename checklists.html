<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checklists | Flight App</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f4f7fb;color:#172033}header{height:68px;background:#fff;border-bottom:1px solid #dfe6ef;display:flex;align-items:center;padding:0 24px;gap:24px;position:sticky;top:0;z-index:5}.brand{font-size:20px;font-weight:800;color:#1769d1;text-decoration:none}.nav{display:flex;gap:5px}.nav a{padding:9px 11px;border-radius:8px;color:#5d6879;text-decoration:none;font-size:13px;font-weight:650}.nav a.active,.nav a:hover{background:#eaf3ff;color:#1769d1}.status{margin-left:auto;font-size:12px;color:#718096;display:flex;gap:7px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:#d97706}.dot.ok{background:#16a34a}.dot.bad{background:#dc2626}main{max-width:1200px;margin:auto;padding:28px 18px}.heading h1{margin:0 0 6px;font-size:28px}.heading p{margin:0 0 22px;color:#718096;font-size:14px}.filters{display:grid;grid-template-columns:1fr 220px;gap:10px;background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:14px;margin-bottom:18px}.input,select{width:100%;height:42px;border:1px solid #d7e0ea;border-radius:8px;padding:0 11px;background:#fff;color:#172033;outline:none}.input:focus,select:focus{border-color:#76a9df;box-shadow:0 0 0 3px rgba(23,105,209,.08)}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.panel{background:#fff;border:1px solid #dfe6ef;border-radius:12px;overflow:hidden}.panel h2{font-size:15px;margin:0;padding:15px 16px;border-bottom:1px solid #e7ebf1}.aircrafts{padding:8px}.aircraft{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:8px;cursor:pointer}.aircraft:hover,.aircraft.active{background:#eaf3ff}.aircraft small{display:block;color:#7b8797;font-size:10px;text-transform:uppercase;font-weight:750;margin-bottom:3px}.aircraft strong{font-size:13px}.content{padding:16px}.category{margin-bottom:22px}.category-title{font-size:16px;font-weight:800;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid #e7ebf1}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{border:1px solid #dfe6ef;border-radius:10px;background:#fff;overflow:hidden}.thumb{height:150px;background:#f0f4f8;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}.thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}.thumb.no-image{color:#7b8797;font-size:12px;cursor:default}.info{padding:12px}.name{font-size:14px;font-weight:750}.meta{font-size:11px;color:#7b8797;margin-top:4px}.open{margin-top:10px;border:0;background:#1769d1;color:#fff;border-radius:7px;padding:8px 11px;font-size:11px;font-weight:750;cursor:pointer}.empty{padding:35px;text-align:center;color:#7b8797;font-size:13px}.viewer{display:none;position:fixed;inset:0;background:rgba(10,18,30,.9);z-index:50;padding:20px}.viewer.show{display:flex;flex-direction:column}.viewer-head{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:10px}.close{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:7px;width:38px;height:36px;font-size:20px;cursor:pointer}.viewer-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto}.viewer-body img{max-width:96%;max-height:94%;object-fit:contain}.viewer-body .viewer-error{color:#fff;text-align:center;font-size:14px;max-width:420px}@media(max-width:800px){.nav{display:none}.filters{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.aircrafts{display:flex;overflow:auto;gap:5px}.aircraft{min-width:150px}.cards{grid-template-columns:1fr}}
</style>
    <link rel="stylesheet" href="common-header.css?v=1">
</head>
<body>
<header><a class="brand" href="index.html">Flight App</a><nav class="nav"><a href="index.html">Home</a><a href="checklists.html" class="active">Checklists</a><a href="checklist-admin.html">Checklist Admin</a><a href="charts.html">Charts</a><a href="simbrief.html">SimBrief</a></nav><div class="status"><span class="dot" id="dot"></span><span id="status">Connecting...</span></div></header>
<main>
<div class="heading"><h1>Aircraft Checklists</h1><p>Choose an aircraft and open the checklist you need.</p></div>
<div class="filters"><input id="search" class="input" placeholder="Search checklist..."><select id="categoryFilter"><option value="">All categories</option></select></div>
<div class="layout"><section class="panel"><h2>Aircraft</h2><div id="aircrafts" class="aircrafts"></div></section><section class="panel"><div id="content" class="content"><div class="empty">Loading checklists...</div></div></section></div>
</main>
<div id="viewer" class="viewer"><div class="viewer-head"><strong id="viewerTitle">Checklist</strong><button id="close" class="close">×</button></div><div class="viewer-body"><img id="viewerImage" alt="Checklist"></div></div>
<script>
const API='https://echo-msfs-charts.onrender.com';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const oldNames={PREFLIGHT:'Preflight',COCKPIT:'Cockpit Preparation',BEFORE_START:'Before Start',START:'Engine Start',TAXI:'Taxi',TAKEOFF:'Takeoff',CLIMB:'Climb',CRUISE:'Cruise',DESCENT:'Descent',APPROACH:'Approach',LANDING:'Landing',SHUTDOWN:'Shutdown',EMERGENCY:'Emergency',OTHER:'Other'};
let aircraft=[],checklists=[],selectedAircraft='';
function category(c){const note=String(c?.notes||'');if(note.toUpperCase().startsWith('FLIGHTAPP_CATEGORY:'))return note.slice('FLIGHTAPP_CATEGORY:'.length).trim();return oldNames[String(c?.category||'OTHER').toUpperCase()]||'Other'}
function image(c){return `${API}/api/checklists/${encodeURIComponent(c.id)}/image?v=${encodeURIComponent(c.created_at||Date.now())}`}
async function api(path){const r=await fetch(API+path,{headers:{Accept:'application/json'}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function renderAircraft(){const box=$('aircrafts');box.innerHTML='<button class="aircraft '+(!selectedAircraft?'active':'')+'" data-id=""><small>All aircraft</small><strong>All checklists</strong></button>';aircraft.forEach(a=>{const b=document.createElement('button');b.className='aircraft '+(String(selectedAircraft)===String(a.id)?'active':'');b.dataset.id=a.id;b.innerHTML='<small>'+esc(a.manufacturer||'')+'</small><strong>'+esc(a.name||a.aircraft_name||'Aircraft')+'</strong>';box.appendChild(b)});box.querySelectorAll('.aircraft').forEach(b=>b.onclick=()=>{selectedAircraft=b.dataset.id;renderAircraft();render()})}
function renderCategories(){const names=[...new Map(checklists.map(category).map(n=>[n.toLowerCase(),n])).values()].sort((a,b)=>a.localeCompare(b));const select=$('categoryFilter'),current=select.value;select.innerHTML='<option value="">All categories</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');if(names.includes(current))select.value=current}
function render(){renderCategories();const q=$('search').value.trim().toLowerCase(),cf=$('categoryFilter').value;const rows=checklists.filter(c=>(!selectedAircraft||String(c.aircraft_id)===String(selectedAircraft))&&(!cf||category(c)===cf)&&(!q||String(c.name||'').toLowerCase().includes(q)));const grouped={};rows.forEach(c=>(grouped[category(c)]??=[]).push(c));const names=Object.keys(grouped).sort((a,b)=>a.localeCompare(b));if(!names.length){$('content').innerHTML='<div class="empty">No checklists found.</div>';return}$('content').innerHTML=names.map(n=>'<section class="category"><h3 class="category-title">'+esc(n)+'</h3><div class="cards">'+grouped[n].map(c=>{const a=aircraft.find(x=>String(x.id)===String(c.aircraft_id));return '<article class="card"><div class="thumb" data-view="'+c.id+'"><img src="'+esc(image(c))+'" alt="'+esc(c.name||'Checklist')+'" loading="lazy"></div><div class="info"><div class="name">'+esc(c.name||'Checklist')+'</div><div class="meta">'+esc([a?.manufacturer||c.manufacturer,a?.name||c.aircraft_name].filter(Boolean).join(' ')||'Unknown aircraft')+'</div><button class="open" data-view="'+c.id+'">Open checklist</button></div></article>'}).join('')+'</div></section>').join('');$('content').querySelectorAll('.thumb img').forEach(img=>img.addEventListener('error',()=>{const t=img.closest('.thumb');t.classList.add('no-image');t.innerHTML='<span>Checklist image unavailable</span>';t.onclick=null},{once:true}));$('content').querySelectorAll('[data-view]').forEach(e=>e.onclick=()=>open(Number(e.dataset.view)))}
function open(id){const c=checklists.find(x=>Number(x.id)===id);if(!c)return;const body=$('viewer').querySelector('.viewer-body');body.innerHTML='<img id="viewerImage" alt="Checklist">';$('viewerTitle').textContent=c.name||'Checklist';const img=$('viewerImage');img.src=image(c);img.onerror=()=>{body.innerHTML='<div class="viewer-error">This checklist image could not be loaded.</div>'};$('viewer').classList.add('show')}
function closeViewer(){$('viewer').classList.remove('show')}
$('close').onclick=closeViewer;$('viewer').onclick=e=>{if(e.target.id==='viewer')closeViewer()};$('search').oninput=render;$('categoryFilter').onchange=render;
async function load(){try{$('dot').className='dot ok';$('status').textContent='Backend online';const a=await api('/api/aircraft');aircraft=Array.isArray(a.aircraft)?a.aircraft:[];const c=await api('/api/checklists');checklists=Array.isArray(c.checklists)?c.checklists:[];renderAircraft();render()}catch(e){console.error('Checklist load error:',e);$('dot').className='dot bad';$('status').textContent='Backend unavailable';$('content').innerHTML='<div class="empty">Could not load checklists.</div>'}}load();
</script>
    <script src="common-header.js?v=1"></script>
</body>
</html>

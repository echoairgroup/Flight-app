<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1018"><title>Create Account | Flight App</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#1b293b,#070b11 60%);color:#f5f7fa;font-family:Inter,system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);background:#111a25;border:1px solid #2b394a;border-radius:24px;padding:32px;box-shadow:0 30px 80px #0009}.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#5b8cff,#806df5);display:grid;place-items:center;font-size:22px}.eyebrow{margin-top:22px;color:#5b8cff;text-transform:uppercase;letter-spacing:1.6px;font-size:10px;font-weight:800}h1{font-size:32px;letter-spacing:-1px;margin:7px 0}p{color:#8d9aaa;font-size:13px;line-height:1.6}label{display:block;font-size:11px;color:#aab5c3;font-weight:700;margin:18px 0 7px}input{width:100%;height:48px;border:1px solid #2b394a;background:#0b121b;color:white;border-radius:10px;padding:0 13px;outline:none}input:focus{border-color:#5b8cff;box-shadow:0 0 0 3px #5b8cff22}.btn{width:100%;height:50px;margin-top:22px;border:0;border-radius:11px;background:#5b8cff;color:white;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.08)}.error{display:none;margin-top:14px;padding:11px;border-radius:9px;background:#3a1820;color:#ff9ca5;font-size:12px}.links{text-align:center;margin-top:20px;font-size:12px;color:#8d9aaa}.links a{color:#6da0ff;text-decoration:none}.back{display:inline-block;margin-top:20px;color:#8d9aaa;text-decoration:none;font-size:12px}.back:hover{color:white}
</style></head><body><main class="card"><div class="logo">✈</div><div class="eyebrow">Flight App EFB</div><h1>Create your account</h1><p>Your Flight App account will store your profile and connect services such as SimBrief.</p><form id="form"><label for="displayName">Display name</label><input id="displayName" maxlength="80" autocomplete="name" placeholder="Pilot name"><label for="username">Username</label><input id="username" required minlength="3" maxlength="30" autocomplete="username" placeholder="pilot123"><label for="password">Password</label><input id="password" required minlength="8" type="password" autocomplete="new-password" placeholder="At least 8 characters"><button class="btn" type="submit">Create account</button><div class="error" id="error"></div></form><div class="links">Already have an account? <a href="login.html">Sign in</a></div><a class="back" href="index.html">← Back to EFB</a></main><script>
const API=window.FLIGHT_APP_API||'https://echo-msfs-charts.onrender.com';
const form=document.getElementById('form'),error=document.getElementById('error');
form.addEventListener('submit',async e=>{e.preventDefault();error.style.display='none';try{const r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:displayName.value,username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed.');localStorage.setItem('flightAppToken',d.token);location.href='simbrief.html';}catch(x){error.textContent=x.message;error.style.display='block';}});
</script></body></html>

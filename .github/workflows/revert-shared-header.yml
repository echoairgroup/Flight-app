name: Revert shared header changes

on:
  push:
    paths:
      - '.github/workflows/revert-shared-header.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert shared header commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert 6c01d421eee143f4a5dfedb83124fd8f5d1326a1 --no-edit
          git push

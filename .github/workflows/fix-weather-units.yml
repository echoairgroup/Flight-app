name: Fix Weather Units Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-weather-units:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add reliable weather unit button
        shell: python
        run: |
          from pathlib import Path

          path = Path("weather.html")
          text = path.read_text(encoding="utf-8")

          marker = "FLIGHT_APP_WEATHER_UNITS_FALLBACK_V2"
          if marker in text:
              print("Fallback already installed; nothing to do.")
              raise SystemExit(0)

          injection = r'''\n<script>\n/* FLIGHT_APP_WEATHER_UNITS_FALLBACK_V2 */\n(() => {\n    function installReliableWeatherUnitButton() {\n        const header = document.querySelector('.page-header');\n        if (!header || document.getElementById('weatherUnitToggleFallback')) return;\n\n        const button = document.createElement('button');\n        button.type = 'button';\n        button.id = 'weatherUnitToggleFallback';\n        button.className = 'weather-unit-toggle';\n        button.setAttribute('aria-label', 'Switch weather units');\n        button.title = localStorage.getItem('flightAppWeatherUnits') === 'us'\n            ? 'Switch to metric units'\n            : 'Switch to US units';\n\n        const isUS = localStorage.getItem('flightAppWeatherUnits') === 'us';\n        button.innerHTML = '<i class="fa-solid fa-temperature-half unit-toggle-icon"></i><span>' +\n            (isUS ? 'Metric Units' : 'US Units') + '</span>';\n\n        button.addEventListener('click', () => {\n            const current = localStorage.getItem('flightAppWeatherUnits') === 'us' ? 'us' : 'metric';\n            localStorage.setItem('flightAppWeatherUnits', current === 'us' ? 'metric' : 'us');\n            window.location.reload();\n        });\n\n        header.appendChild(button);\n    }\n\n    if (document.readyState === 'loading') {\n        document.addEventListener('DOMContentLoaded', installReliableWeatherUnitButton, { once: true });\n    } else {\n        installReliableWeatherUnitButton();\n    }\n})();\n</script>\n'''

          closing = "</body>"
          if closing not in text:
              raise SystemExit("Could not find </body> in weather.html")

          text = text.replace(closing, injection + "\n" + closing, 1)
          path.write_text(text, encoding="utf-8")
          print("Installed reliable weather unit fallback.")

      - name: Commit weather fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.html
          git rm .github/workflows/fix-weather-units.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: show weather US units switch"
          git push

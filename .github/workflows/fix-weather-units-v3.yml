name: Repair Weather Units Button

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-weather-units:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add static weather unit button
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('weather.html')
          text = path.read_text(encoding='utf-8')

          # Remove all previous temporary unit-button patches.
          text = re.sub(
              r'<!-- FLIGHT_APP_WEATHER_UNITS_STATIC_V4 -->.*?<!-- /FLIGHT_APP_WEATHER_UNITS_STATIC_V4 -->\s*',
              '', text, flags=re.S
          )
          text = re.sub(
              r'<script>\s*/\* FLIGHT_APP_WEATHER_UNITS_V3 \*/.*?</script>\s*',
              '', text, flags=re.S
          )
          text = re.sub(
              r'<script>\s*/\* FLIGHT_APP_WEATHER_UNITS_FALLBACK_V2 \*/.*?</script>\s*',
              '', text, flags=re.S
          )

          header = '<div class="page-header">'
          if header not in text:
              raise SystemExit('Could not find .page-header')

          button = '''<div class="page-header">
<!-- FLIGHT_APP_WEATHER_UNITS_STATIC_V4 -->
<button id="weatherUnitToggleStaticV4" type="button" aria-label="Switch weather units" style="margin-left:auto;flex-shrink:0;display:inline-flex!important;align-items:center;justify-content:center;padding:10px 16px;border:1px solid #d9e0ea;border-radius:11px;background:#ffffff;color:#344054;font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 4px 14px rgba(16,24,40,.08);white-space:nowrap;cursor:pointer;">US Units</button>
<!-- /FLIGHT_APP_WEATHER_UNITS_STATIC_V4 -->'''
          text = text.replace(header, button, 1)

          script = '''
<script>
/* FLIGHT_APP_WEATHER_UNITS_STATIC_V4_SCRIPT */
(function () {
  var key = 'flightAppWeatherUnits';
  var button = document.getElementById('weatherUnitToggleStaticV4');
  if (!button) return;

  function isUS() {
    return localStorage.getItem(key) === 'us';
  }

  function updateButton() {
    button.textContent = isUS() ? 'Metric Units' : 'US Units';
  }

  button.addEventListener('click', function () {
    localStorage.setItem(key, isUS() ? 'metric' : 'us');
    window.location.reload();
  });

  updateButton();
})();
</script>
'''

          if 'FLIGHT_APP_WEATHER_UNITS_STATIC_V4_SCRIPT' not in text:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body>')
              text = text.replace('</body>', script + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.html
          git rm .github/workflows/fix-weather-units-v3.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: add visible weather units switch"
          git push
